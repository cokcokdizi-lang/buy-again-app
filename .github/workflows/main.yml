name: Build BuyAgain APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip  TEST_BuyAgain_4.2_LATEST.zip- d android-project

      - name: Build APK
        working-directory: android-project/TEST_BuyAgain_4.1.3_Project
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuyAgain-debug-APK
          path: android-project/TEST_BuyAgain_4.1.3_Project/app/build/outputs/apk/debug/app-debug.apk
